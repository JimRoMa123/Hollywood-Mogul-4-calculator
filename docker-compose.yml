
services:
  postgres:
    image: postgres:16-alpine
    container_name: hm4_postgres
    environment:
      POSTGRES_DB: hm4_calculator
      POSTGRES_USER: sofi
      POSTGRES_PASSWORD: hollywood2024
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports:
      - "3000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofi -d hm4_calculator"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: hm4_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hm4.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hm4_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: sofi
      DB_PASSWORD: hollywood2024
      DB_DATABASE: hm4_calculator
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hm4_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
